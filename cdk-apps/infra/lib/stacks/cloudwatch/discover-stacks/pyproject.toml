[tool.poetry]
name = "discover-stacks"
version = "0.1.0"
description = "Discover AWS CloudFormation stacks."
authors = ["lior.dux@cellebrite.com"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
boto3 = "^1.35.87"
python-dotenv = "^1.0.1"
markdown = "^3.7"
markdownify = "^0.14.1"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
mypy = "^1.14.0"
types-boto3 = "^1.35.87"
types-botocore = "^1.0.2"
ruff = "^0.8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
