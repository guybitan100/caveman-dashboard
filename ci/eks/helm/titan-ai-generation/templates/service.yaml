apiVersion: v1
kind: Service
metadata:
  name: titan-ai-generation
  namespace: {{ .Values.namespace }}
  labels:
    app: titan-ai-generation
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: titan-ai-generation
