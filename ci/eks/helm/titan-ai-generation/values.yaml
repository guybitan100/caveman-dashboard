replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

namespace: titan

serviceAccount:
  name: titan-ai-generation
  irsaRoleArn: ""

service:
  port: 80
  targetPort: 80
  type: ClusterIP

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/idle-timeout: "1800"
  host: titanai-backend.ai.aws.cellebrite.local

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

env:
  TITAN_MEDIA_GENERATION_BATCH_SIZE: "5"
  TITAN_MEDIA_GENERATION_ENABLED: "true"
  TITAN_MEDIA_GENERATION_RETRY_ATTEMPTS: "3"
  TITAN_VERSION: "1.0.0"

# Additional TITAN_* env vars merged at deploy time
titanEnv: {}

healthCheck:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

nodeSelector: {}
tolerations: []
