replicaCount: 2

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

namespace: titan

serviceAccount:
  name: titan-litellm
  irsaRoleArn: ""

service:
  port: 80
  targetPort: 80
  type: ClusterIP

resources:
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

command: ["--port", "80", "--config", "config.yaml"]

env: {}

healthCheck:
  path: /
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

nodeSelector: {}
tolerations: []
