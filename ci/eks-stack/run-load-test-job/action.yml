name: Run EKS Load Job

description: Run Helm-based EKS load job and collect logs/artifacts

inputs:
  job_name:
    description: Kubernetes job name and Helm release name
    required: true
  args_json:
    description: JSON array for runner args
    required: true
  ecr_repo_uri:
    description: ECR repository URI
    required: true
  image_tag:
    description: ECR image tag to deploy
    required: false
    default: latest
  s3_bucket_name:
    description: S3 bucket name for load artifacts
    required: true
  irsa_role_arn:
    description: IRSA role ARN for service account
    required: true
  eks_cluster_name:
    description: Optional EKS cluster name to refresh kubeconfig before Helm run
    required: false
    default: ""
  aws_region:
    description: Optional AWS region used for kubeconfig refresh
    required: false
    default: ""
  enable_eks_autoscale:
    description: Enable pre-run managed nodegroup scale-up for target cluster (true/false)
    required: false
    default: "false"
  eks_autoscale_step:
    description: Number of nodes to add to desired capacity per matching nodegroup when autoscale is enabled
    required: false
    default: "1"
  eks_autoscale_max_desired:
    description: Global desired-capacity ceiling per nodegroup when autoscale is enabled
    required: false
    default: "20"
  eks_autoscale_nodegroup_filters:
    description: Comma-separated substring filters for nodegroup names to scale (empty=all)
    required: false
    default: ""
  log_group_name:
    description: CloudWatch Logs group name for publishing job logs
    required: false
    default: ""
  result_dir:
    description: Result directory for logs and artifacts
    required: true
  upload_udrs_s3_real_file:
    description: Optional CLBT_UPLOAD_UDRS_S3_REAL_FILE value to pass into pod env (0/1)
    required: false
    default: ""
  upload_udrs_s3_bucket:
    description: Optional CLBT_UPLOAD_UDRS_S3_BUCKET value to pass into pod env
    required: false
    default: ""
  upload_complete_timeout_s:
    description: Optional CLBT_UPLOAD_COMPLETE_TIMEOUT_S value to pass into pod env (seconds)
    required: false
    default: ""
  wait_timeout_s:
    description: Optional max seconds to wait for Kubernetes job terminal state (default 2700)
    required: false
    default: "2700"
  resources_requests_cpu:
    description: Optional Kubernetes resources.requests.cpu override for the job pod
    required: false
    default: ""
  resources_requests_memory:
    description: Optional Kubernetes resources.requests.memory override for the job pod
    required: false
    default: ""
  resources_limits_cpu:
    description: Optional Kubernetes resources.limits.cpu override for the job pod
    required: false
    default: ""
  resources_limits_memory:
    description: Optional Kubernetes resources.limits.memory override for the job pod
    required: false
    default: ""
  fail_open_create_upload_403:
    description: Treat createUpload 403 in captured pod logs as success (setup-only fail-open behavior)
    required: false
    default: "false"
  delete_existing_evidences:
    description: Optional CLBT_DELETE_EXISTING_EVIDENCES value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  directory_enable_upload_header_variants:
    description: Optional CLBT_DIRECTORY_ENABLE_UPLOAD_HEADER_VARIANTS value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  directory_enable_system_upload_fallback:
    description: Optional CLBT_DIRECTORY_ENABLE_SYSTEM_UPLOAD_FALLBACK value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  directory_enable_initiator_strip_retry:
    description: Optional CLBT_DIRECTORY_ENABLE_INITIATOR_STRIP_RETRY value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  setup_provision_with_cognito:
    description: Optional CLBT_SETUP_PROVISION_WITH_COGNITO value to pass into pod env (true/false/1/0)
    required: false
    default: "true"
  setup_force_token_refresh_after_operator:
    description: Optional CLBT_SETUP_FORCE_TOKEN_REFRESH_AFTER_OPERATOR value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  setup_force_token_refresh_after_operator_strict:
    description: Optional CLBT_SETUP_FORCE_TOKEN_REFRESH_AFTER_OPERATOR_STRICT value to pass into pod env (true/false/1/0)
    required: false
    default: ""
  setup_upload_part_size_bytes:
    description: Optional CLBT_SETUP_UPLOAD_PART_SIZE_BYTES value to pass into pod env
    required: false
    default: ""
  setup_upload_parallel_files:
    description: Optional CLBT_SETUP_UPLOAD_PARALLEL_FILES value to pass into pod env (1-6)
    required: false
    default: ""
  log_level:
    description: Optional CLBT_LOG_LEVEL value to pass into pod env (fatal/error/warn/info/debug/trace)
    required: false
    default: ""
  extra_env_json:
    description: Optional JSON array of extra env vars to inject into the pod (e.g. [{"name":"FOO","value":"bar"}])
    required: false
    default: "[]"

outputs:
  exit_code:
    description: Exit code from job wait status
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Ensure AWS CLI executable
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/ensure-aws-cli.sh"

    - name: Ensure native Helm executable
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/ensure-native-helm.sh"

    - name: Run load job
      id: run
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job_name }}
        ARGS_JSON: ${{ inputs.args_json }}
        EKS_CLUSTER_NAME: ${{ inputs.eks_cluster_name }}
        EKS_AWS_REGION: ${{ inputs.aws_region }}
        ENABLE_EKS_AUTOSCALE: ${{ inputs.enable_eks_autoscale }}
        EKS_AUTOSCALE_STEP: ${{ inputs.eks_autoscale_step }}
        EKS_AUTOSCALE_MAX_DESIRED: ${{ inputs.eks_autoscale_max_desired }}
        EKS_AUTOSCALE_NODEGROUP_FILTERS: ${{ inputs.eks_autoscale_nodegroup_filters }}
        ECR_REPO_URI: ${{ inputs.ecr_repo_uri }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        S3_BUCKET_NAME: ${{ inputs.s3_bucket_name }}
        IRSA_ROLE_ARN: ${{ inputs.irsa_role_arn }}
        LOG_GROUP_NAME: ${{ inputs.log_group_name }}
        RESULT_DIR: ${{ inputs.result_dir }}
        UPLOAD_UDRS_S3_REAL_FILE: ${{ inputs.upload_udrs_s3_real_file }}
        UPLOAD_UDRS_S3_BUCKET: ${{ inputs.upload_udrs_s3_bucket }}
        UPLOAD_COMPLETE_TIMEOUT_S: ${{ inputs.upload_complete_timeout_s }}
        WAIT_TIMEOUT_S: ${{ inputs.wait_timeout_s }}
        RESOURCES_REQUESTS_CPU: ${{ inputs.resources_requests_cpu }}
        RESOURCES_REQUESTS_MEMORY: ${{ inputs.resources_requests_memory }}
        RESOURCES_LIMITS_CPU: ${{ inputs.resources_limits_cpu }}
        RESOURCES_LIMITS_MEMORY: ${{ inputs.resources_limits_memory }}
        FAIL_OPEN_CREATE_UPLOAD_403: ${{ inputs.fail_open_create_upload_403 }}
        CLBT_DELETE_EXISTING_EVIDENCES: ${{ inputs.delete_existing_evidences }}
        CLBT_DIRECTORY_ENABLE_UPLOAD_HEADER_VARIANTS: ${{ inputs.directory_enable_upload_header_variants }}
        CLBT_DIRECTORY_ENABLE_SYSTEM_UPLOAD_FALLBACK: ${{ inputs.directory_enable_system_upload_fallback }}
        CLBT_DIRECTORY_ENABLE_INITIATOR_STRIP_RETRY: ${{ inputs.directory_enable_initiator_strip_retry }}
        CLBT_SETUP_PROVISION_WITH_COGNITO: ${{ inputs.setup_provision_with_cognito }}
        CLBT_SETUP_FORCE_TOKEN_REFRESH_AFTER_OPERATOR: ${{ inputs.setup_force_token_refresh_after_operator }}
        CLBT_SETUP_FORCE_TOKEN_REFRESH_AFTER_OPERATOR_STRICT: ${{ inputs.setup_force_token_refresh_after_operator_strict }}
        CLBT_SETUP_UPLOAD_PART_SIZE_BYTES: ${{ inputs.setup_upload_part_size_bytes }}
        CLBT_SETUP_UPLOAD_PARALLEL_FILES: ${{ inputs.setup_upload_parallel_files }}
        CLBT_LOG_LEVEL: ${{ inputs.log_level }}
        EXTRA_ENV_JSON: ${{ inputs.extra_env_json }}
      run: python3 -u "${GITHUB_ACTION_PATH}/run-load-test-job.py"
