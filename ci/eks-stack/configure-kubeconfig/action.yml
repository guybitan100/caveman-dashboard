name: Configure Kubeconfig

description: Configure kubectl context for the target EKS cluster

inputs:
  eks_cluster_name:
    description: EKS cluster name
    required: true
  aws_region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:
    - name: Update kubeconfig
      shell: bash
      env:
        EKS_CLUSTER_NAME: ${{ inputs.eks_cluster_name }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: bash "${GITHUB_ACTION_PATH}/configure-kubeconfig.sh"
