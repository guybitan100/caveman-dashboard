name: Build EKS Job Metadata

description: Build deterministic EKS job metadata (job name and args JSON) for Helm job runs

inputs:
  tenant:
    description: Tenant identifier
    required: true
  run_id:
    description: GitHub run ID
    required: true
  run_index:
    description: Matrix run index
    required: true
  runner_args:
    description: Runner args string used by the load runner
    required: false
    default: ""

outputs:
  job_name:
    description: Kubernetes job name
    value: ${{ steps.build.outputs.job_name }}
  args_json:
    description: JSON array of runner args without --rp
    value: ${{ steps.build.outputs.args_json }}

runs:
  using: composite
  steps:
    - name: Build metadata
      id: build
      shell: bash
      env:
        TENANT: ${{ inputs.tenant }}
        RUN_ID: ${{ inputs.run_id }}
        RUN_INDEX: ${{ inputs.run_index }}
        RUNNER_ARGS: ${{ inputs.runner_args }}
      run: |
        set -euo pipefail

        JOB_SUFFIX=$(echo "$TENANT" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
        JOB_NAME="atlas-load-${RUN_ID}-${RUN_INDEX}-${JOB_SUFFIX}"
        if [[ ${#JOB_NAME} -gt 53 ]]; then
          JOB_NAME="${JOB_NAME:0:53}"
          JOB_NAME="${JOB_NAME%-}"
        fi

        ARGS_JSON=$(python3 -c 'import json,os,shlex; print(json.dumps([a for a in shlex.split(os.environ.get("RUNNER_ARGS", "")) if a != "--rp"]))')

        echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
        echo "args_json=$ARGS_JSON" >> "$GITHUB_OUTPUT"
