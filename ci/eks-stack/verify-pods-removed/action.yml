name: Verify EKS Job Pods Removed

description: Verify all pods for a Kubernetes job are removed from a namespace

inputs:
  job_name:
    description: Kubernetes job name used as pod selector label `job-name`
    required: true
  namespace:
    description: Kubernetes namespace where job pods are expected
    required: false
    default: atlas-load
  max_attempts:
    description: Number of poll attempts before failing
    required: false
    default: "30"
  sleep_seconds:
    description: Sleep duration between poll attempts
    required: false
    default: "10"
  delete_job_first:
    description: Best-effort delete the Kubernetes Job before verification
    required: false
    default: "true"
  force_delete_pods:
    description: Best-effort force-delete pods matching the job label before verification
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Verify pods removed
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job_name }}
        NAMESPACE: ${{ inputs.namespace }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        DELETE_JOB_FIRST: ${{ inputs.delete_job_first }}
        FORCE_DELETE_PODS: ${{ inputs.force_delete_pods }}
      run: bash "${GITHUB_ACTION_PATH}/verify-pods-removed.sh"
