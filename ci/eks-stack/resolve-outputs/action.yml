name: Resolve EKS Outputs

description: Resolve EKS runtime outputs from deploy step or existing CloudFormation stacks

inputs:
  skip_eks_deploy:
    description: Whether EKS deploy is skipped
    required: true
  environment_name:
    description: Environment name
    required: true
  platform_stack_name:
    description: Platform stack name
    required: false
    default: platform-eks
  deploy_ecr_repo_uri:
    description: ECR repo URI from deploy step
    required: false
    default: ""
  deploy_log_group_name:
    description: Log group name from deploy step
    required: false
    default: ""
  deploy_eks_cluster_name:
    description: EKS cluster name from deploy step
    required: false
    default: ""
  deploy_irsa_role_arn:
    description: IRSA role ARN from deploy step
    required: false
    default: ""
  deploy_s3_bucket_name:
    description: S3 bucket name from deploy step
    required: false
    default: ""
  var_eks_cluster_name:
    description: Fallback EKS cluster name from repo vars
    required: false
    default: ""

outputs:
  ecr_repo_uri:
    description: ECR repository URI
    value: ${{ steps.resolve.outputs.ecr_repo_uri }}
  log_group_name:
    description: CloudWatch log group name
    value: ${{ steps.resolve.outputs.log_group_name }}
  eks_cluster_name:
    description: EKS cluster name
    value: ${{ steps.resolve.outputs.eks_cluster_name }}
  irsa_role_arn:
    description: IRSA role ARN
    value: ${{ steps.resolve.outputs.irsa_role_arn }}
  s3_bucket_name:
    description: S3 bucket name
    value: ${{ steps.resolve.outputs.s3_bucket_name }}

runs:
  using: composite
  steps:
    - name: Resolve outputs
      id: resolve
      shell: bash
      env:
        SKIP_EKS_DEPLOY: ${{ inputs.skip_eks_deploy }}
        ENV_NAME: ${{ inputs.environment_name }}
        PLATFORM_STACK: ${{ inputs.platform_stack_name }}
        DEPLOY_ECR_REPO_URI: ${{ inputs.deploy_ecr_repo_uri }}
        DEPLOY_LOG_GROUP_NAME: ${{ inputs.deploy_log_group_name }}
        DEPLOY_EKS_CLUSTER_NAME: ${{ inputs.deploy_eks_cluster_name }}
        DEPLOY_IRSA_ROLE_ARN: ${{ inputs.deploy_irsa_role_arn }}
        DEPLOY_S3_BUCKET_NAME: ${{ inputs.deploy_s3_bucket_name }}
        VAR_EKS_CLUSTER_NAME: ${{ inputs.var_eks_cluster_name }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/resolve-outputs.py"
