name: EKS Stack

description: Deploy and validate EKS platform/env CloudFormation stacks and expose output values

inputs:
  environment_name:
    description: Environment name (e.g. perf02)
    required: true

  eks_cluster_name:
    description: Existing EKS cluster name (optional, falls back to eks-app-<environment>)
    required: false
    default: ""

  eks_oidc_provider_arn:
    description: IAM OIDC provider ARN for EKS cluster
    required: false
    default: ""

  eks_oidc_issuer_hostpath:
    description: OIDC issuer hostpath without https://
    required: false
    default: ""

  ecr_repository_name:
    description: Existing ECR repository name
    required: false
    default: atlas-repo

  log_group_name:
    description: Existing CloudWatch log group name for load logs
    required: false
    default: /aws/eks/PerformanceTesting

  platform_stack_name:
    description: Platform stack name
    required: false
    default: platform-eks

  export_prefix:
    description: CloudFormation export prefix
    required: false
    default: PlatformEks

outputs:
  ecr_repo_uri:
    description: ECR repository URI
    value: ${{ steps.deploy.outputs.ecr_repo_uri }}

  log_group_name:
    description: CloudWatch log group name
    value: ${{ steps.deploy.outputs.log_group_name }}

  eks_cluster_name:
    description: EKS cluster name used by jobs
    value: ${{ steps.deploy.outputs.eks_cluster_name }}

  irsa_role_arn:
    description: IRSA role ARN
    value: ${{ steps.deploy.outputs.irsa_role_arn }}

  s3_bucket_name:
    description: S3 bucket name for artifacts/results
    value: ${{ steps.deploy.outputs.s3_bucket_name }}

runs:
  using: composite
  steps:
    - name: Deploy EKS stacks
      id: deploy
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment_name }}
        EKS_CLUSTER_NAME: ${{ inputs.eks_cluster_name }}
        EKS_OIDC_PROVIDER_ARN: ${{ inputs.eks_oidc_provider_arn }}
        EKS_OIDC_ISSUER_HOSTPATH: ${{ inputs.eks_oidc_issuer_hostpath }}
        ECR_REPOSITORY_NAME: ${{ inputs.ecr_repository_name }}
        EKS_LOG_GROUP_NAME: ${{ inputs.log_group_name }}
        PLATFORM_STACK: ${{ inputs.platform_stack_name }}
        EXPORT_PREFIX: ${{ inputs.export_prefix }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/deploy.sh"
