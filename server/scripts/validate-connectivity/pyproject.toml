[tool.poetry]
name = "validate-connectivity"
version = "0.1.0"
description = "Validation and connectivity check for AWS resources"
authors = ["lior.dux@cellebrite.com"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
boto3 = "^1.35.87"
pymongo = "^4.10.1"
elasticsearch = "^8.17.0"
python-dotenv = "^1.0.1"
opensearch-py = "^2.8.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
mypy = "^1.14.0"
types-boto3 = "^1.35.87"
types-botocore = "^1.0.2"
ruff = "^0.8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
