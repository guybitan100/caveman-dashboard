[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=1.0.0",]

[tool.poetry]
authors = [ "Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>", "Daniel Hurwitz <daniel.hurwitz@cellebrite.com>",]
description = "SDK client for SiX MetaFinder service"
name = "metafinder_client"
version = "1.0.2"

[[tool.poetry.source]]
name = "artifact"
url = "https://cellebrite-983918838720.d.codeartifact.us-east-1.amazonaws.com/pypi/six/"
priority = "explicit"

[tool.poetry.dependencies]
boto3 = "^1.35.90"
pydantic = "^2.10.4"
python = "^3.13"
requests = "^2.27.1"
metafinder_core = {path = "../../backend/lib/metafinder_core", develop = true, extras = ["athena"] }
dependency-injector = "^4.40.0"
aiohttp = "^3.11.11"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.32.0"
pytest = "^8.3.4"
pytest-mock = "^3.7.0"
black = "^24.10.0"

[tool.poe.tasks]
test = "pytest"
