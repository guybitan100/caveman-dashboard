[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=1.0.0",]

[tool.poetry]
authors = [ "Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>", "Daniel Hurwitz <daniel.hurwitz@cellebrite.com>",]
description = "'Titan code API client'"
name = "titan-client"
version = "1.0.2"

[[tool.poetry.source]]
name = "artifact"
url = "https://cellebrite-983918838720.d.codeartifact.us-east-1.amazonaws.com/pypi/titan/"
priority = "explicit"


[tool.poetry.dependencies]
python = "^3.13"
loguru = "^0.7.3"
model = {path = "../../backend/lib/model", develop = true}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.32.0"
pytest = "^8.3.4"
pytest-mock = "^3.7.0"
black = "^24.10.0"

[tool.poe.tasks]
test = "pytest"


