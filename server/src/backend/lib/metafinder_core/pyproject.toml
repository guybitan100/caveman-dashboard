[tool.poetry]
name = "metafinder-core"
version = "0.1.0"
description = ""
authors = ["Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
model = {path = "../model", develop = true}
core = {path = "../core", develop = true}
boto3-stubs = {version = "^1.36.18", extras = ["athena"], optional = true}
opensearch-py = { version = "^2.8.0", optional = true }

[tool.poetry.extras]
opensearch = ["opensearch-py"]
athena = ["boto3-stubs"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-mock = "^3.7.0"
black = "^24.10.0"
pytest-env = "^1.1.5"

[tool.pytest_env]
TITAN_VERSION="2.0.9"
TITAN_AWS_REGION="eu-central-1"
TITAN_DEPLOYMENT="local"
TITAN_S3_TITAN_BUCKET_NAME="titan-bucket-test"
TITAN_METAFINDER_S3_BUCKET_NAME="metafinder-bucket-test"
TITAN_METAFINDER_OPENSEARCH_PASSWORD="password"
TITAN_METAFINDER_OPENSEARCH_USER="user"
TITAN_METAFINDER_OPENSEARCH_CA_CERTS="path/to/cert.pem"
TITAN_JOB_EXPIRY_DAYS="30"
TITAN_ENVIRONMENT="test"
TITAN_DB_DOCUMENT_DB_USER="user"
TITAN_DB_DOCUMENT_DB_PASSWORD="password"
TITAN_DB_DOCUMENT_DB_CERT_PATH="path/to/cert.pem"