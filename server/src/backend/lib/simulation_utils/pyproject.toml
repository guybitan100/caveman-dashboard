[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=1.0.0",]

[tool.poetry]
name = "simulation-utils"
version = "0.1.0"
description = "Simulation Utilities package"
authors = [ "Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>", "Daniel Hurwitz <daniel.hurwitz@cellebrite.com>",]

[[tool.poetry.source]]
name = "artifact"
url = "https://cellebrite-983918838720.d.codeartifact.us-east-1.amazonaws.com/pypi/titan/"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.13"
Faker = { version = "^9.7.1"}
model = {path = "../model", develop = true}
core = {path = "../core", develop = true}
metafinder_core = { path = "../metafinder_core", develop = true, extras=["athena"]}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-mock = "^3.7.0"
pytest-env = "^1.1.5"
