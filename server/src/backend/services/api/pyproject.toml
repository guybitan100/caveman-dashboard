[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=1.0.0",]

[tool.poetry]
authors = [ "Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>", "Daniel Hurwitz <daniel.hurwitz@cellebrite.com>",]
description = "Titan Manager service"
name = "api"
version = "0.0.0"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.6"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
typer = "^0.15.1"
langcodes = { version = "^3.3.0", extras = ["data"] }
model = {path = "../../lib/model", develop = true}
core = {path = "../../lib/core", develop = true}
titan_db = {path = "../../lib/titan_db", develop = true}
metafinder_client = { path = "../../../clients/metafinder_client", develop = true }
simulation_utils = { path = "../../lib/simulation_utils", develop = true }
generation = { path = "../generation", develop = true,  optional = true, extras = ["genertae_entities", "random_job"]}
mangum = "^0.19.0"
boto3-stubs = { version = "^1.35.90", extras = ["s3", "lambda", "ecs"] }
numpy = "^2.4.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-mock = "^3.7.0"
black = "^24.10.0"
pytest-asyncio = "^0.23.1"
requests-mock = "^1.9.3"
httpx = "^0.28.1"
moto = "^5.0.25"
pytest-xdist = "^3.6.1"
pytest-env = "^1.1.5"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--ignore=api_tests/integration_tests"

[tool.pytest_env]
TITAN_VERSION="2.0.9"
TITAN_AWS_REGION="eu-central-1"
TITAN_DEPLOYMENT="local"
TITAN_S3_TITAN_BUCKET_NAME="titan-bucket-test"
TITAN_METAFINDER_S3_BUCKET_NAME="metafinder-bucket-test"
TITAN_METAFINDER_OPENSEARCH_PASSWORD="password"
TITAN_METAFINDER_OPENSEARCH_USER="user"
TITAN_METAFINDER_OPENSEARCH_CA_CERTS="path/to/cert.pem"
TITAN_JOB_EXPIRY_DAYS="30"
TITAN_ENVIRONMENT="test"
TITAN_DB_DOCUMENT_DB_USER="user"
TITAN_DB_DOCUMENT_DB_PASSWORD="password"
TITAN_DB_DOCUMENT_DB_CERT_PATH="path/to/cert.pem"

[tool.poetry.extras]
dev = ["generation"]