[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0", ]

[tool.poetry]
authors = ["Yitzchak Siegel-Bareket <yitzchak.siegel-bareket@cellebrite.com>", "Daniel Hurwitz <daniel.hurwitz@cellebrite.com>", ]
description = "Titan Generation service"
name = "generation"
version = "0.0.0"

[tool.poetry.dependencies]
python = "^3.13"
Faker = { version = "^9.7.1", optional = true}
numpy = { version = "^2.2.1", optional = true}
xsdata = { version = "^21.11", optional = true}
smart-open = { version = "^7.1.0", extras = ["s3"], optional = true}
model = { path = "../../lib/model", develop = true }
core = { path = "../../lib/core", develop = true }
titan_db = { path = "../../lib/titan_db", develop = true, optional = true}
metafinder_core = { path = "../../lib/metafinder_core", develop = true, optional = true, extras=["athena"]}
simulation_utils = { path = "../../lib/simulation_utils", develop = true }
geopy = { version = "^2.2.0", optional = true}
aiohttp = { version = "^3.8.3", optional = true}
tzdata = { version = "^2024.1", optional = true}
aws-lambda-powertools = { version = "^3.4.0", extras = ["parser"], optional = true}
aioboto3 = "^13.4.0"
types-aioboto3 = {version = "^13.4.0", extras = ["lambda"]}

[tool.poetry.extras]
generate_job = ["Faker", "numpy", "xsdata", "smart-open", "titan_db", "metafinder_core", "geopy", "aiohttp", "tzdata"]
generate_entities = ["Faker", "aws-lambda-powertools", "metafinder_core"]
random_job = ["numpy", "aws-lambda-powertools"]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pyinstrument = "^5.0.0"
pytest-cov = "^6.0.0"
pytest = "^8.3.4"
pytest-mock = "^3.7.0"
black = "^24.10.0"
moto = "^5.0.25"
httpx = "^0.28.1"
ruff = "^0.4.8"
pytest-env = "^1.1.5"

[tool.pytest.ini_options]
pythonpath = "."

[tool.pytest_env]
TITAN_VERSION="2.0.9"
TITAN_AWS_REGION="eu-central-1"
TITAN_DEPLOYMENT="local"
TITAN_S3_TITAN_BUCKET_NAME="titan-bucket-test"
TITAN_METAFINDER_S3_BUCKET_NAME="metafinder-bucket-test"
TITAN_METAFINDER_OPENSEARCH_PASSWORD="password"
TITAN_METAFINDER_OPENSEARCH_USER="user"
TITAN_METAFINDER_OPENSEARCH_CA_CERTS="path/to/cert.pem"
TITAN_JOB_EXPIRY_DAYS="30"
TITAN_ENVIRONMENT="test"
TITAN_DB_DOCUMENT_DB_USER="user"
TITAN_DB_DOCUMENT_DB_PASSWORD="password"
TITAN_DB_DOCUMENT_DB_CERT_PATH="path/to/cert.pem"
TITAN_WEBSOCKET_ENDPOINT="https://app_id.appsync-api.eu-central-1.amazonaws.com/event"
TITAN_WEBSOCKET_API_KEY="da2-123"

[tool.ruff.lint]
select = ["NPY201"]